name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded runs on PRs only. A push to main (including a pin/release
  # commit) always runs to completion so its per-job-green verdict is never lost
  # to an auto-cancel that later reads as red.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Setup
        uses: ./.github/actions/setup
      - name: Type check
        run: bun run typecheck
      - name: Type check (tests)
        run: bun run typecheck:test

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Setup
        uses: ./.github/actions/setup
      - name: Configure git for tests
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@test.com"
      - name: Run tests
        run: bun run test

  workflow-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Setup
        uses: ./.github/actions/setup
      - name: Workflow structure check
        run: bun run workflows:check
      - name: Changelog section check
        run: bun run changelog:check

  # ── build+smoke: build the linux-x64 binary and run the toolchain's banner
  #    smoke (version banner, no placeholder version, sqlite-vec addon staged,
  #    no forbidden strings baked into the binary). Uploaded so boot-smoke below
  #    reuses these bytes instead of rebuilding them. ──────────────────────────
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [typecheck, test, workflow-check]
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Setup
        uses: ./.github/actions/setup
      - name: Build (linux-x64)
        run: bun run build:linux-x64
      - name: Banner smoke
        run: bun run smoke
      - name: Upload build output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-build-linux-x64
          path: |
            dist/goodvibes-daemon-linux-x64
            dist/lib
          if-no-files-found: error
          retention-days: 1

  # ── boot smoke: proves the COMPILED binary serves HTTP, reports an honest
  #    banner, and fails loudly on a broken settings file — see scripts/boot-smoke.ts.
  #    Also runs the hosted-session proof (scripts/hosted-session-proof.ts): the
  #    same binary actually creating, steering, detaching, and reattaching a
  #    hosted session end to end. ────────────────────────────────────────────
  boot-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build]
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Setup
        uses: ./.github/actions/setup
      - name: Download build output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-build-linux-x64
          path: dist/
      - name: Restore executable bit
        run: chmod +x dist/goodvibes-daemon-linux-x64
      - name: Boot smoke
        run: bun run smoke:boot
      - name: Hosted-session smoke
        run: bun run smoke:hosted

  # ---------------------------------------------------------------------------
  # Zero-touch release. Runs only after EVERY gating job above is green (its
  # `needs` covers all of them, so GitHub schedules it last and only on full
  # success), and only for pushes to main. When the release commit's version has
  # no tag yet, it creates the annotated tag at this SHA and dispatches
  # release.yml at that tag with mode=release.
  #
  # Why the dispatch (not just the tag push): a tag pushed with GITHUB_TOKEN does
  # NOT trigger workflows, so the tag alone would never start release.yml. The
  # documented exception is that a workflow_dispatch API call made with
  # GITHUB_TOKEN DOES create a run — so we push the tag (for provenance + the
  # manual redo path) and then explicitly dispatch the release at that tag ref.
  # Idempotent: an already-existing tag is a logged no-op.
  # ---------------------------------------------------------------------------
  auto-release:
    name: Auto-release (tag + dispatch on green)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs:
      - typecheck
      - test
      - workflow-check
      - build
      - boot-smoke
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Read version from package.json
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Tag the release and dispatch release.yml (idempotent)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          # Idempotent no-op if the tag already exists on the remote (a re-run,
          # or a manual tag already pushed): do not re-tag or re-dispatch.
          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q "refs/tags/${TAG}"; then
            echo "Tag ${TAG} already exists on origin — nothing to do."
            exit 0
          fi
          git config user.name "GoodVibes CI"
          git config user.email "ci@goodvibes.local"
          git tag -a "${TAG}" -m "release ${VERSION}" "${SHA}"
          # Push with GITHUB_TOKEN: this does NOT trigger release.yml (token
          # pushes never trigger workflows), which is why we dispatch below.
          git push origin "refs/tags/${TAG}"
          echo "Created and pushed ${TAG} at ${SHA}."
          # Dispatch release.yml at the tag ref. workflow_dispatch via the API
          # under GITHUB_TOKEN DOES create a run (the documented exception).
          for attempt in 1 2 3 4 5 6 7 8; do
            if gh workflow run release.yml --ref "refs/tags/${TAG}" -f mode=release; then
              echo "Dispatched release.yml for ${TAG} (mode=release)."
              exit 0
            fi
            echo "gh workflow run failed (attempt ${attempt}/8); retrying in 7s…" >&2
            sleep 7
          done
          echo "ERROR: failed to dispatch release.yml for ${TAG} after 8 attempts." >&2
          exit 1
